<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Register Simanja</title>
</head>
<body class="bg-green-50 bg-cover bg-center">

  <section class="min-h-screen flex items-center justify-center">
    <div class="bg-green-100 flex rounded-2xl shadow-lg max-w-3xl p-5 items-center">

      <div class="md:block hidden w-1/2">
        <img class="rounded-2xl object-cover h-full w-full" src="gambarduit.jpg" alt="">
      </div>

      <div class="md:w-1/2 px-8">
        <h2 class="font-bold text-2xl text-green-900">Daftar</h2>
        <p class="text-sm mt-4 text-green-900">Buat akun baru untuk mulai mengelola keuanganmu</p>

        <form action="" onsubmit="event.preventDefault()" class="flex flex-col gap-4 mt-8">
          <input class="p-2 rounded-xl border" type="text" placeholder="Nama Lengkap">
          <input class="p-2 rounded-xl border" type="text" placeholder="Email">

          <div class="relative">
            <input class="p-2 rounded-xl border w-full" type="password" placeholder="Sandi">
          </div>

          <!-- FIX TOMBOL REGISTER -->
          <button 
            onclick="localStorage.setItem('isLoggedIn','true'); window.location.href='login.html';"
            class="bg-green-900 rounded-xl text-white py-2 hover:scale-105 duration-300">
            Daftar
          </button>
        </form>

        <div class="mt-5 text-xs border-b text-green-900 py-4">
          <a href="login.html">Sudah punya akun?</a>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
